<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 설문 - (주)태방파텍</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; background:#f4f6f9; color:#1e3a5f; padding:16px; min-height:100vh; }
  .wrap { max-width:520px; margin:0 auto; }

  .header { text-align:center; padding:22px 16px 20px; background:#fff; border:1px solid #dde4ee;
            border-radius:18px; margin-bottom:16px; }
  .header img { height:44px; width:auto; margin-bottom:14px; }
  .header h1 { font-size:1.7rem; font-weight:800; letter-spacing:-.02em; color:#0b4da2; }
  .header .sub { font-size:.92rem; color:#7b8798; margin-top:6px; }

  .tabs { display:flex; background:#e6ecf5; border-radius:14px; padding:5px; margin-bottom:20px; }
  .tab { flex:1; text-align:center; padding:14px 0; font-size:1.1rem; font-weight:700; border-radius:10px; cursor:pointer; color:#1e3a5f; }
  .tab.active { background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .page { display:none; } .page.active { display:block; }

  .intro { text-align:center; font-size:1rem; color:#6b7887; margin-bottom:16px; line-height:1.6; }
  .legend { background:#eef3fa; border:1px solid #d8e2f0; border-radius:12px; padding:12px 14px;
            font-size:.86rem; color:#41566f; text-align:center; margin-bottom:18px; line-height:1.7; }

  .qcard { background:#fff; border:1px solid #dde4ee; border-radius:18px; padding:20px 18px; margin-bottom:16px; }
  .qhead { display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .qnum { background:#0b4da2; color:#fff; font-size:.78rem; font-weight:700; padding:3px 12px; border-radius:999px; }
  .qtag { background:#eaf1fb; color:#0b4da2; font-size:.75rem; font-weight:700; padding:3px 10px; border-radius:999px; }
  .qtext { font-size:1.12rem; font-weight:700; line-height:1.55; margin-bottom:16px; }
  .circles { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .opt { background:#f7f9fc; border:2px solid #dde4ee; border-radius:14px; padding:12px 4px 10px;
         text-align:center; cursor:pointer; transition:all .15s; }
  .opt .n { font-size:1.35rem; font-weight:800; line-height:1.1; }
  .opt .l { font-size:.68rem; color:#8b96a5; margin-top:4px; line-height:1.3; word-break:keep-all; }
  .opt.selected { background:#0b4da2; border-color:#0b4da2; }
  .opt.selected .n, .opt.selected .l { color:#fff; }

  .btn-submit { width:100%; padding:20px 0; background:#0b4da2; color:#fff; font-size:1.25rem; font-weight:700;
                border:none; border-radius:12px; cursor:pointer; font-family:inherit; margin-top:6px; }
  .btn-submit:disabled { opacity:.55; }
  .msg { text-align:center; margin-top:16px; font-size:1.02rem; font-weight:600; min-height:1.5em; }
  .msg.error { color:#c0392b; } .msg.ok { color:#1f7a45; }

  /* 결과 */
  .top-card { background:#fff; border:1px solid #dde4ee; border-radius:18px; padding:24px; text-align:center; margin-bottom:16px; }
  .people { font-size:2.3rem; font-weight:800; color:#0b4da2; }
  .people small { font-size:1rem; color:#8b96a5; font-weight:600; }
  .overall { color:#7b8798; font-size:.95rem; margin-top:6px; }
  .rescard { background:#fff; border:1px solid #dde4ee; border-radius:18px; padding:20px 18px; margin-bottom:16px; }
  .rtitle { font-size:.9rem; color:#8b96a5; font-weight:600; margin-bottom:16px; }
  .bar-row { margin-bottom:26px; padding-bottom:22px; border-bottom:1px dashed #e6ecf5; }
  .bar-row:last-child { border-bottom:none; padding-bottom:0; margin-bottom:0; }
  .bar-label { display:flex; justify-content:space-between; font-size:.92rem; font-weight:700; margin-bottom:7px; gap:10px; }
  .bar-label .score { color:#0b4da2; flex-shrink:0; }
  .track { background:#eef1f6; border-radius:8px; height:20px; overflow:hidden; }
  .fill { height:100%; background:linear-gradient(90deg,#4d8ad6,#0b4da2); border-radius:8px; width:0; transition:width .6s ease; }

  .dist { margin-top:12px; display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .dcell { background:#f7f9fc; border:1px solid #e6ecf5; border-radius:10px; padding:8px 2px 7px; text-align:center; }
  .dcell .dn { font-size:.7rem; color:#8b96a5; font-weight:700; }
  .dcell .dv { font-size:1.1rem; font-weight:800; color:#1e3a5f; line-height:1.35; }
  .dcell .dp { font-size:.65rem; color:#a3adbb; }
  .dcell.top { background:#eaf1fb; border-color:#b9d1f0; }
  .dcell.top .dv { color:#0b4da2; }
  .dcell.zero .dv { color:#ccd4de; }

  .btn-refresh { width:100%; padding:17px 0; background:#fff; border:1px solid #cfd8e6; border-radius:12px;
                 font-size:1.1rem; font-weight:700; color:#1e3a5f; cursor:pointer; font-family:inherit; margin-bottom:16px; }
  .reset-link { display:block; margin:0 auto; text-align:center; color:#8b96a5; text-decoration:underline;
                font-size:.95rem; cursor:pointer; background:none; border:none; font-family:inherit; }
  .spin { display:inline-block; width:18px; height:18px; border:3px solid rgba(255,255,255,.4); border-top-color:#fff;
          border-radius:50%; animation:sp .7s linear infinite; vertical-align:-3px; margin-right:8px; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>

  <div class="tabs">
    <div class="tab active" id="tabInput">설문 참여</div>
    <div class="tab" id="tabResult">결과 보기</div>
  </div>

  <div class="page active" id="pageInput">
    <div class="intro">아래 4개 문항에 솔직하게 답해 주세요</div>
    <div class="legend">1 전혀 아니다 · 2 아니다 · 3 보통<br>4 그렇다 · 5 매우 그렇다</div>

    </div>

      <div class="rtitle">문항별 평균과 응답 분포 (점수별 인원수)</div>
      <div id="barArea"></div>
    </div>
    <button class="btn-refresh" id="refreshBtn">새로고침</button>
    <button class="reset-link" id="resetBtn">전체 데이터 초기화</button>

<script>
  /* ============================================================
     ★★★ 질문을 바꾸려면 아래 QUESTIONS 목록만 수정하세요 ★★★
     ============================================================ */

  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx2OchaMIjWDWvhIGVti3bawC6iSS6NE0-zwoxqScdU7fYkZSub3rTaJqT3sJ3WQZ5USA/exec';

  var MAX = 5;
  var LABELS = ['전혀<br>아니다', '아니다', '보통', '그렇다', '매우<br>그렇다'];

  var QUESTIONS = [
    { text: '나는 AI(챗지피티·제미나이 등)를 자주 사용한다', tag: '사용 빈도' },
    { text: '나는 AI를 업무에 활용해본 적이 있다',            tag: '업무 적용' },
    { text: '나는 AI에게 원하는 것을 잘 설명(지시)할 수 있다', tag: '지시 역량' },
    { text: 'AI를 배우면 내 업무가 편해질 것 같다',           tag: '태도' }
  ];

  /* ============ 이 아래는 수정할 필요 없습니다 ============ */

  var selected = [];
  for (var i = 0; i < QUESTIONS.length; i++) selected.push(null);
  var submitting = false, autoTimer = null, lastRound = null;

  (function buildQuestions() {
    var area = document.getElementById('questionArea');
    QUESTIONS.forEach(function (q, qi) {
      var card = document.createElement('div');
      card.className = 'qcard';

      var head = document.createElement('div');
      head.className = 'qhead';
      head.innerHTML = '<span class="qnum">Q' + (qi + 1) + '</span>' +
                       (q.tag ? '<span class="qtag">' + q.tag + '</span>' : '');

      var txt = document.createElement('div');
      txt.className = 'qtext'; txt.textContent = q.text;

      var grid = document.createElement('div');
      grid.className = 'circles';
      for (var n = 1; n <= MAX; n++) {
        (function (score) {
          var o = document.createElement('div');
          o.className = 'opt';
          o.innerHTML = '<div class="n">' + score + '</div><div class="l">' + LABELS[score - 1] + '</div>';
          o.onclick = function () {
            selected[qi] = score;
            var all = grid.children;
            for (var j = 0; j < all.length; j++) all[j].classList.remove('selected');
            o.classList.add('selected');
            setMsg('', '');
          };
          grid.appendChild(o);
        })(n);
      }
      card.appendChild(head); card.appendChild(txt); card.appendChild(grid);
      area.appendChild(card);
    });
  })();

  function setMsg(text, type) {
    var m = document.getElementById('inputMsg');
    m.textContent = text; m.className = 'msg ' + (type || '');
  }

  function showPage(which) {
    document.getElementById('pageInput').classList.toggle('active', which === 'input');
    document.getElementById('pageResult').classList.toggle('active', which === 'result');
    document.getElementById('tabInput').classList.toggle('active', which === 'input');
    document.getElementById('tabResult').classList.toggle('active', which === 'result');
    if (which === 'result') {
      refresh(true);
      if (autoTimer) clearInterval(autoTimer);
      autoTimer = setInterval(function () { refresh(false); }, 7000);
    } else if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  }
  document.getElementById('tabInput').onclick = function () { showPage('input'); };
  document.getElementById('tabResult').onclick = function () { showPage('result'); };

  function api(options) {
    return fetch(SCRIPT_URL + (options.query || ''), {
      method: options.method || 'GET',
      body: options.body ? JSON.stringify(options.body) : undefined,
      headers: options.body ? { 'Content-Type': 'text/plain;charset=utf-8' } : undefined
    }).then(function (r) { return r.json(); });
  }

  document.getElementById('submitBtn').onclick = function () {
    if (submitting) return;
    var missing = [];
    selected.forEach(function (v, i) { if (v === null) missing.push('Q' + (i + 1)); });
    if (missing.length) { setMsg(missing.join(', ') + ' 문항에 답해 주세요.', 'error'); return; }

    var doneRound = null;
    try { doneRound = localStorage.getItem('submittedRoundAI'); } catch (e) {}
    if (doneRound !== null && lastRound !== null && Number(doneRound) === lastRound) {
      if (!confirm('이미 제출하셨습니다. 다시 제출할까요?')) return;
    }

    submitting = true;
    var btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>제출 중...';
    setMsg('', '');

    api({ method: 'POST', body: { scores: selected } })
      .then(function (res) {
        if (res.error) throw new Error(res.error);
        setMsg('제출이 완료되었습니다. 감사합니다!', 'ok');
        try { localStorage.setItem('submittedRoundAI', String(res.round)); } catch (e) {}
        applyResults(res);
      })
      .catch(function () { setMsg('제출 중 오류가 발생했습니다. 다시 시도해 주세요.', 'error'); })
      .finally(function () {
        submitting = false; btn.disabled = false; btn.textContent = '제출하기';
      });
  };

  function refresh(showLoading) {
    if (showLoading) document.getElementById('barArea').innerHTML = '<div style="color:#8b96a5">불러오는 중...</div>';
    api({ query: '?action=results' })
      .then(applyResults)
      .catch(function () {
        document.getElementById('barArea').innerHTML = '<div style="color:#c0392b">데이터를 불러올 수 없습니다.</div>';
      });
  }
  document.getElementById('refreshBtn').onclick = function () { refresh(true); };

  function applyResults(res) {
    lastRound = res.round;
    document.getElementById('peopleNum').textContent = res.people || 0;
    document.getElementById('overallNum').textContent = (res.overall || 0).toFixed(1);

    var area = document.getElementById('barArea');
    area.innerHTML = '';
    if (!res.people) {
      area.innerHTML = '<div style="color:#8b96a5">아직 제출된 응답이 없습니다.</div>';
      return;
    }
    QUESTIONS.forEach(function (q, i) {
      var avg = (res.avgs && res.avgs[i]) || 0;
      var dist = (res.dists && res.dists[i]) || [];

      var total = 0, peak = 0;
      for (var k = 0; k < MAX; k++) {
        var c = dist[k] || 0;
        total += c;
        if (c > peak) peak = c;
      }

      var cells = '';
      for (var k2 = 0; k2 < MAX; k2++) {
        var cnt = dist[k2] || 0;
        var pct = total > 0 ? Math.round(cnt / total * 100) : 0;
        var cls = 'dcell' + (cnt === 0 ? ' zero' : (cnt === peak && peak > 0 ? ' top' : ''));
        cells += '<div class="' + cls + '">' +
                 '<div class="dn">' + (k2 + 1) + '점</div>' +
                 '<div class="dv">' + cnt + '</div>' +
                 '<div class="dp">' + (cnt > 0 ? pct + '%' : '&nbsp;') + '</div>' +
                 '</div>';
      }

      var row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML =
        '<div class="bar-label"><span>Q' + (i + 1) + '. ' + q.text + '</span>' +
        '<span class="score">' + avg.toFixed(1) + '</span></div>' +
        '<div class="track"><div class="fill" style="width:' + (avg / MAX * 100) + '%"></div></div>' +
        '<div class="dist">' + cells + '</div>';
      area.appendChild(row);
    });
  }

  document.getElementById('resetBtn').onclick = function () {
    if (!confirm('모든 응답 데이터를 삭제할까요?')) return;
    api({ query: '?action=reset' }).then(applyResults).catch(function () {
      alert('초기화에 실패했습니다.');
    });
  };
</script>
</body>
</html>
